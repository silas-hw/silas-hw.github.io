---
layout: default
---
<h1>Blogs</h1>

{% unless page.category == null %}
<p>Matching Category: <strong> {{ page.category }} </strong></p>
{% endunless %}

<div class="block-list">
    {% for post in site.posts  %}
    {% if post.categories contains page.category or page.category == null%}
    <a href="{{ post.url }}" class="page-preview">
        <h3>{{ post.title }} <button>X</button> <button>?</button></h3>

        <div>
            <p>{{ post.date }}</p>
        </div>
        
    </a>
    {% endif %}
    {% endfor %}
</div>
