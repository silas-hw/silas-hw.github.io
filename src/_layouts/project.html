---
layout: default
---

<h1>{{ page.title }}</h1>

<section class="info">
  <p>{{ page.year }}</p>

  <ul class="tags">
    <p><b>Tags: </b></p>
    {% for tag in page.tags %} 
      <li>{{ tag }}{% unless forloop.last %},{% endunless %}</li>
    {% endfor %}
  </ul>
</section>
  
<section class="content">
  {{ content }}
</section>
